<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - SignEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-3">

    <div class="card border-0 shadow-sm p-4 p-md-5 text-center bg-white" style="max-width: 500px; border-radius: 16px;">
        <div class="rounded-circle bg-danger-subtle text-danger mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h4 class="fw-bold mb-2" th:text="${error != null ? error : 'An Error Occurred'}">Error</h4>
        <p class="text-muted mb-4 small" th:text="${message != null ? message : 'The requested resource could not be found or processed.'}">
            Something went wrong.
        </p>

        <div>
            <a th:href="@{/dashboard}" class="btn btn-primary px-3 me-2">Go to Dashboard</a>
            <a th:href="@{/}" class="btn btn-outline-secondary px-3">Home</a>
        </div>
    </div>

</body>
</html>
