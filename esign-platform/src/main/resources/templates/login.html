<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SignEase Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 440px; width: 100%; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="p-3">

    <div class="login-card bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none d-inline-flex align-items-center mb-2">
                <i class="fa-solid fa-file-signature text-primary fs-2 me-2"></i>
                <span class="fs-3 fw-bold text-primary">Sign<span class="text-dark">Ease</span></span>
            </a>
            <h5 class="fw-bold mb-1">Welcome back</h5>
            <p class="text-muted small">Sign in to your electronic signature workspace</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3">
            <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3">
            <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" id="username" name="username" class="form-control border-start-0" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <label for="password" class="form-label small fw-semibold">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-decoration-none text-primary">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Sign In</button>
        </form>

        <!-- Quick 1-Click Demo Logins for Testing -->
        <div class="p-3 bg-light rounded-3 border mb-3">
            <div class="small fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.72rem;">Quick 1-Click Test Logins</div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-dark flex-fill" onclick="fillLogin('admin@esign.com', 'admin123')">
                    <i class="fa-solid fa-user-shield me-1"></i> Admin
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillLogin('demo@esign.com', 'password123')">
                    <i class="fa-solid fa-user-pen me-1"></i> Sender
                </button>
            </div>
        </div>

        <div class="text-center text-muted small">
            Don't have an account? <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Create free account</a>
        </div>
    </div>

    <script>
        function fillLogin(email, pwd) {
            document.getElementById('username').value = email;
            document.getElementById('password').value = pwd;
        }
    </script>
</body>
</html>
