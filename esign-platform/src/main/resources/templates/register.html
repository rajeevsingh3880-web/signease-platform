<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account - SignEase Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reg-card { max-width: 520px; width: 100%; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="p-3">

    <div class="reg-card bg-white p-4 p-md-5 my-4">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none d-inline-flex align-items-center mb-2">
                <i class="fa-solid fa-file-signature text-primary fs-2 me-2"></i>
                <span class="fs-3 fw-bold text-primary">Sign<span class="text-dark">Ease</span></span>
            </a>
            <h5 class="fw-bold mb-1">Create your business workspace</h5>
            <p class="text-muted small">Send your first document within 5 minutes of signup</p>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" id="regForm">
            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" placeholder="Rajesh" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" placeholder="Sharma" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Organization / Business Name</label>
                <input type="text" th:field="*{organizationName}" class="form-control" placeholder="Acme Technologies Pvt Ltd" required>
            </div>

            <!-- Email Address with Send OTP Button -->
            <div class="mb-3">
                <label class="form-label small fw-semibold">Work Email Address *</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" th:field="*{email}" id="emailInput" class="form-control border-start-0" placeholder="rajesh@acme.com" required>
                    <button type="button" class="btn btn-outline-primary fw-semibold" id="sendOtpBtn">Get OTP</button>
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                <div id="otpStatusMsg" class="small mt-1"></div>
            </div>

            <!-- Email Verification OTP Field -->
            <div class="mb-3 p-3 bg-light rounded-3 border" id="otpGroup">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-semibold mb-0">Email Verification Code (OTP) *</label>
                    <span id="otpVerifiedBadge" class="badge bg-success-subtle text-success d-none"><i class="fa-solid fa-circle-check me-1"></i>Email Verified</span>
                </div>
                <div class="input-group">
                    <input type="text" th:field="*{otpCode}" id="otpCodeInput" class="form-control font-monospace text-center fs-5 fw-bold" placeholder="------" maxlength="6" required>
                    <button type="button" class="btn btn-secondary fw-semibold" id="verifyOtpBtn">Verify Code</button>
                </div>
                <div class="form-text small text-muted" id="otpHelperText">Click <strong>Get OTP</strong> above to receive your 6-digit code in Gmail.</div>
                <div class="text-danger small" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Mobile Phone (for OTP notifications)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">+91</span>
                    <input type="tel" th:field="*{phone}" class="form-control border-start-0" placeholder="9876543210">
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                <label class="form-check-label small text-muted" for="termsCheck">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> &amp; electronic execution policies under IT Act 2000.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="createAccountBtn">Create Free Account</button>
        </form>

        <div class="text-center text-muted small">
            Already have an account? <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Sign in here</a>
        </div>
    </div>

    <script>
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const emailInput = document.getElementById('emailInput');
        const otpCodeInput = document.getElementById('otpCodeInput');
        const otpStatusMsg = document.getElementById('otpStatusMsg');
        const otpVerifiedBadge = document.getElementById('otpVerifiedBadge');
        const otpHelperText = document.getElementById('otpHelperText');
        const regForm = document.getElementById('regForm');

        let isVerified = false;
        let cooldownTimer = null;

        function setStatus(msg, isError) {
            otpStatusMsg.innerHTML = `<span class="${isError ? 'text-danger' : 'text-success'} fw-medium">${msg}</span>`;
        }

        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                setStatus('Please enter a valid email address first.', true);
                emailInput.focus();
                return;
            }

            sendOtpBtn.disabled = true;
            sendOtpBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Sending...';
            setStatus('Sending verification code to your email...', false);

            try {
                const res = await fetch('/api/v1/auth/send-registration-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (!res.ok || data.success === false) {
                    throw new Error(data.error || 'Failed to send verification code.');
                }

                setStatus('Verification code sent to ' + email + '! Check your inbox.', false);
                otpCodeInput.focus();

                // 60-second cooldown timer
                let timeLeft = 60;
                sendOtpBtn.innerText = `Resend (${timeLeft}s)`;
                if (cooldownTimer) clearInterval(cooldownTimer);
                cooldownTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(cooldownTimer);
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.innerText = 'Resend OTP';
                    } else {
                        sendOtpBtn.innerText = `Resend (${timeLeft}s)`;
                    }
                }, 1000);
            } catch (err) {
                setStatus(err.message, true);
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerText = 'Get OTP';
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const otp = otpCodeInput.value.trim();
            if (!otp || otp.length !== 6) {
                setStatus('Please enter the 6-digit code sent to your email.', true);
                otpCodeInput.focus();
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

            try {
                const res = await fetch('/api/v1/auth/verify-registration-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otpCode: otp })
                });
                const data = await res.json();
                if (!res.ok || data.success === false) {
                    throw new Error(data.error || 'Invalid or expired verification code.');
                }

                isVerified = true;
                verifyOtpBtn.className = 'btn btn-success fw-semibold';
                verifyOtpBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Verified';
                otpVerifiedBadge.classList.remove('d-none');
                otpHelperText.className = 'form-text small text-success fw-semibold';
                otpHelperText.innerText = 'Email successfully authenticated!';
                setStatus('Email authenticated successfully! Click Create Free Account below.', false);
            } catch (err) {
                setStatus(err.message, true);
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.innerText = 'Verify Code';
            }
        });

        regForm.addEventListener('submit', (e) => {
            const otp = otpCodeInput.value.trim();
            if (!otp || otp.length !== 6) {
                e.preventDefault();
                setStatus('Please request and enter your 6-digit email verification code.', true);
                otpCodeInput.focus();
            }
        });
    </script>
</body>
</html>
