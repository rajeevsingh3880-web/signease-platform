<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Documents - SignEase Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
        .badge-status-DRAFT { background: #f1f5f9; color: #475569; }
        .badge-status-SENT { background: #e0f2fe; color: #0284c7; }
        .badge-status-IN_PROGRESS { background: #fef3c7; color: #d97706; }
        .badge-status-COMPLETED { background: #dcfce7; color: #15803d; }
        .badge-status-CANCELLED { background: #fee2e2; color: #b91c1c; }
        .badge-status-DECLINED { background: #fce7f3; color: #be185d; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
                <i class="fa-solid fa-file-signature text-primary fs-4 me-2"></i>
                <span class="fw-bold text-primary">Sign<span class="text-dark">Ease</span></span>
                <span class="badge bg-danger-subtle text-danger ms-2 rounded-pill small">Admin Console</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary">Users</a>
                <a th:href="@{/admin/audit-logs}" class="btn btn-sm btn-outline-secondary">Audit Trail</a>
                <a th:href="@{/dashboard}" class="btn btn-sm btn-primary">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-lg-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="fa-solid fa-folder-tree text-danger me-2"></i> System Documents Registry</h4>
                <p class="text-muted small mb-0">Platform-wide overview of all documents uploaded across all organizations.</p>
            </div>
        </div>

        <div class="card border-0 bg-white shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small text-muted text-uppercase">
                        <tr>
                            <th class="ps-3">Title &amp; File</th>
                            <th>Uploader</th>
                            <th>Status</th>
                            <th>Pages</th>
                            <th>Date</th>
                            <th class="text-end pe-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc : ${documents.content}">
                            <td class="ps-3">
                                <div class="fw-bold" th:text="${doc.title}">Title</div>
                                <div class="small text-muted" th:text="${doc.fileName}">file.pdf</div>
                            </td>
                            <td>
                                <div class="small fw-semibold" th:text="${doc.uploadedBy.fullName}">Owner</div>
                                <div class="small text-muted" th:text="${doc.uploadedBy.email}">owner@email.com</div>
                            </td>
                            <td>
                                <span class="badge rounded-pill px-2 py-1 fw-semibold"
                                      th:classappend="'badge-status-' + ${doc.status}"
                                      th:text="${doc.status}">STATUS</span>
                            </td>
                            <td class="small text-muted" th:text="${doc.pageCount} + ' pgs'">1 pgs</td>
                            <td class="small text-muted" th:text="${#temporals.format(doc.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end pe-3">
                                <a th:href="@{/documents/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-secondary">Inspect</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
