<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Audit Logs - SignEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
                <i class="fa-solid fa-file-signature text-primary fs-4 me-2"></i>
                <span class="fw-bold text-primary">Sign<span class="text-dark">Ease</span></span>
                <span class="badge bg-danger-subtle text-danger ms-2 rounded-pill small">System Audit Ledger</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary">Users</a>
                <a th:href="@{/dashboard}" class="btn btn-sm btn-primary">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-lg-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="fa-solid fa-link text-primary me-2"></i> Immutable Cryptographic Audit Ledger</h4>
                <p class="text-muted small mb-0">System-wide append-only ledger entries chained with previous hashes (FR-09).</p>
            </div>
        </div>

        <div class="card border-0 bg-white shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 font-monospace" style="font-size: 0.8rem;">
                    <thead class="table-light text-muted text-uppercase">
                        <tr>
                            <th class="ps-3">Timestamp (IST)</th>
                            <th>Action</th>
                            <th>Details</th>
                            <th>IP Address</th>
                            <th>Previous Hash</th>
                            <th class="pe-3">Current Hash</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${auditLogs.content}">
                            <td class="ps-3 text-nowrap text-muted" th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy, HH:mm:ss')}">Time</td>
                            <td><span class="badge bg-light text-dark" th:text="${log.action}">action</span></td>
                            <td class="font-sans-serif text-break" style="max-width: 350px; font-family: sans-serif;" th:text="${log.details}">Details</td>
                            <td class="text-muted" th:text="${log.ipAddress}">127.0.0.1</td>
                            <td class="text-muted" th:text="${log.prevHash != null ? #strings.substring(log.prevHash, 0, 12) + '...' : '-'}">-</td>
                            <td class="pe-3 text-success fw-bold" th:text="${#strings.substring(log.currentHash, 0, 12) + '...'}">hash</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
