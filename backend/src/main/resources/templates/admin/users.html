<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Administration - SignEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-2">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/dashboard}">
                <i class="fa-solid fa-file-signature text-primary fs-4 me-2"></i>
                <span class="fw-bold text-primary">Sign<span class="text-dark">Ease</span></span>
                <span class="badge bg-danger-subtle text-danger ms-2 rounded-pill small">Admin Console</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a th:href="@{/admin/audit-logs}" class="btn btn-sm btn-outline-secondary">Audit Trail</a>
                <a th:href="@{/admin/documents}" class="btn btn-sm btn-outline-secondary">All Documents</a>
                <a th:href="@{/dashboard}" class="btn btn-sm btn-primary">Exit to Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-lg-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1"><i class="fa-solid fa-users-gear text-danger me-2"></i> User Administration</h4>
                <p class="text-muted small mb-0">Manage platform users, roles, organizations, and access privileges.</p>
            </div>
        </div>

        <div class="card border-0 bg-white shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small text-muted text-uppercase">
                        <tr>
                            <th class="ps-3">User</th>
                            <th>Organization</th>
                            <th>Role</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Created Date</th>
                            <th class="text-end pe-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usersList}">
                            <td class="ps-3">
                                <div class="fw-bold" th:text="${u.fullName}">User Name</div>
                                <div class="small text-muted" th:text="${u.email}">user@email.com</div>
                            </td>
                            <td class="small" th:text="${u.organization != null ? u.organization.name : 'Default'}">Acme</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.role == T(com.esign.platform.model.User.Role).ADMIN} ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'"
                                      th:text="${u.role}">ROLE</span>
                            </td>
                            <td class="small text-muted" th:text="${u.phone != null ? u.phone : '-'}">-</td>
                            <td>
                                <span th:if="${u.enabled}" class="badge bg-success-subtle text-success">Active</span>
                                <span th:unless="${u.enabled}" class="badge bg-secondary-subtle text-secondary">Disabled</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end pe-3">
                                <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${u.enabled ? 'Disable' : 'Enable'}">
                                        Toggle
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
