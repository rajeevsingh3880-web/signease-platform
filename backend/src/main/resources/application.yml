spring:
  application:
    name: esign-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/esign_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false # Set to true when running dedicated Flyway migrations
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:rajeevsingh3880@gmail.com}
    password: ${MAIL_PASSWORD:ddfo nkwd pofx btbg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "smtp.gmail.com"
            protocols: "TLSv1.2 TLSv1.3"
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  thymeleaf:
    cache: false
    mode: HTML

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  health:
    mail:
      enabled: false

